name: Java CI with Gradle

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # Gradle and the nmcp plugin run on 17; the library is compiled and tested on the 11
          # toolchain it is built for, which Gradle finds through JAVA_HOME_11_X64
          java-version: |
            11
            17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Execute Gradle build
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
