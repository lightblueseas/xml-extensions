name: Java CI with Gradle

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          # Gradle and the nmcp plugin run on 17; the library is compiled and tested on the 11
          # toolchain it is built for, which Gradle finds through JAVA_HOME_11_X64
          java-version: |
            11
            17
          distribution: 'temurin'
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Execute Gradle build
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
